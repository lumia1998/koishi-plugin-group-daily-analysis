<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>星际居民档案</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 28px;
                font:
                    18px/1.75 'Microsoft YaHei',
                    sans-serif;
                color: var(--ink);
                background: var(--back);
            }
            .profile {
                width: 100%;
                max-width: 1000px;
                margin: auto;
                padding: 40px;
                background: var(--paper);
                overflow: hidden;
            }
            h1 {
                font-size: 42px;
                line-height: 1.3;
                margin: 10px 0;
            }
            h2 {
                font-size: 23px;
                margin: 0 0 16px;
            }
            p {
                white-space: pre-wrap;
                margin: 10px 0;
                overflow-wrap: anywhere;
            }
            header,
            .identity {
                display: flex;
                align-items: center;
                gap: 28px;
            }
            .portrait {
                width: 142px;
                height: 142px;
                object-fit: cover;
                flex-shrink: 0;
            }
            .columns {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 24px;
            }
            section {
                min-width: 0;
                margin: 24px 0;
                padding: 24px;
                border: 1px solid var(--line);
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }
            .tags > * {
                max-width: 100%;
                overflow-wrap: anywhere;
            }
            .records {
                overflow-wrap: anywhere;
            }
            .records > * {
                margin: 12px 0;
            }
            footer {
                margin-top: 32px;
                padding-top: 18px;
                border-top: 1px solid var(--line);
                font-size: 14px;
            }
            .empty-state,
            .empty-news {
                opacity: 0.7;
            }
            .chip,
            .tag,
            .news-tag,
            .washi-tape-tag {
                display: inline-block;
                padding: 6px 12px;
                border: 1px solid var(--line);
            }
            @media (max-width: 650px) {
                body {
                    padding: 12px;
                }
                .profile {
                    padding: 22px;
                }
                .columns {
                    grid-template-columns: 1fr;
                }
                header,
                .identity {
                    flex-wrap: wrap;
                }
                h1 {
                    font-size: 32px;
                }
            }
            :root {
                --ink: #c4fce8;
                --back: #07111d;
                --paper: #0b2530;
                --line: #3c746e;
            }
            .profile {
                border: 3px solid #66c8a9;
                border-radius: 48px;
                box-shadow: inset 0 0 0 10px #132f39;
            }
            .console-title {
                display: flex;
                justify-content: space-between;
                color: #ffc876;
                font-size: 28px;
                letter-spacing: 3px;
            }
            .identity {
                margin: 28px 0;
                padding: 24px;
                border: 2px solid #66c8a9;
                border-radius: 60px 12px 12px 60px;
            }
            .portrait {
                border-radius: 50%;
                border: 5px solid #dfaf73;
            }
            section {
                border-radius: 26px;
                background: #10313b;
            }
            h2 {
                color: #ffcf8a;
            }
            .news-tag {
                border-radius: 20px;
                color: #d4ffea;
            }
            .orbit {
                height: 12px;
                border-top: 1px solid #66c8a9;
                border-bottom: 1px solid #66c8a9;
                margin: 20px 0;
            }
        </style>
    </head>
    <body class="${theme}-theme">
        <main
            class="profile paper-container"
            data-profile-theme="retro_futurism"
        >
            <div class="console-title">
                <strong>星际居民档案</strong>
                <span>◉</span>
            </div>
            <div class="orbit"></div>
            <div class="identity">
                <img class="portrait" src="${avatar}" alt="用户头像" />
                <div>
                    <h1>${username}</h1>
                    <p>用户编号 ${userId}</p>
                    <p>最近更新 ${analysisDate}</p>
                </div>
            </div>
            <section class="">
                <h2>主控屏 · 人物摘要</h2>
                <p>${summary}</p>
            </section>
            <div class="columns">
                <section class="">
                    <h2>性格参数</h2>
                    <div class="tags">${keyTraits}</div>
                </section>
                <section class="">
                    <h2>兴趣星图</h2>
                    <div class="tags">${interests}</div>
                </section>
            </div>
            <section class="">
                <h2>通讯模式</h2>
                <p>${communicationStyle}</p>
            </section>
            <section class="">
                <h2>航行观测 · 事实依据</h2>
                <div class="records">${evidence}</div>
            </section>
            <footer>
                长期用户画像 · 基于已积累的观察记录 · 群友称号仅代表本期表现
            </footer>
        </main>
    </body>
</html>
