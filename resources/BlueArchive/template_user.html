<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>学生档案</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 28px;
                font:
                    18px/1.75 'Microsoft YaHei',
                    sans-serif;
                color: var(--ink);
                background: var(--back);
            }
            .profile {
                width: 100%;
                max-width: 1000px;
                margin: auto;
                padding: 40px;
                background: var(--paper);
                overflow: hidden;
            }
            h1 {
                font-size: 42px;
                line-height: 1.3;
                margin: 10px 0;
            }
            h2 {
                font-size: 23px;
                margin: 0 0 16px;
            }
            p {
                white-space: pre-wrap;
                margin: 10px 0;
                overflow-wrap: anywhere;
            }
            header,
            .identity {
                display: flex;
                align-items: center;
                gap: 28px;
            }
            .portrait {
                width: 142px;
                height: 142px;
                object-fit: cover;
                flex-shrink: 0;
            }
            .columns {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 24px;
            }
            section {
                min-width: 0;
                margin: 24px 0;
                padding: 24px;
                border: 1px solid var(--line);
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }
            .tags > * {
                max-width: 100%;
                overflow-wrap: anywhere;
            }
            .records {
                overflow-wrap: anywhere;
            }
            .records > * {
                margin: 12px 0;
            }
            footer {
                margin-top: 32px;
                padding-top: 18px;
                border-top: 1px solid var(--line);
                font-size: 14px;
            }
            .empty-state,
            .empty-news {
                opacity: 0.7;
            }
            .chip,
            .tag,
            .news-tag,
            .washi-tape-tag {
                display: inline-block;
                padding: 6px 12px;
                border: 1px solid var(--line);
            }
            @media (max-width: 650px) {
                body {
                    padding: 12px;
                }
                .profile {
                    padding: 22px;
                }
                .columns {
                    grid-template-columns: 1fr;
                }
                header,
                .identity {
                    flex-wrap: wrap;
                }
                h1 {
                    font-size: 32px;
                }
            }
            :root {
                --ink: #21466b;
                --back: #e8f5ff;
                --paper: #fff;
                --line: #b9d8ec;
            }
            .profile {
                border-top: 12px solid #55bde6;
            }
            .school-banner {
                font-size: 32px;
                font-weight: bold;
                transform: skew(-6deg);
                background: #4fb2df;
                color: white;
                padding: 12px 24px;
                width: 75%;
            }
            .student-card {
                padding: 32px;
                margin: 24px 0;
                background: repeating-linear-gradient(
                    135deg,
                    #f0f9fe,
                    #f0f9fe 18px,
                    #fff 18px,
                    #fff 36px
                );
                border: 2px solid #9edcf1;
            }
            .portrait {
                border: 8px solid white;
                box-shadow: 6px 6px #5ab8df;
            }
            section {
                border: 0;
                border-top: 3px solid #55bde6;
                background: #f1f9ff;
            }
            h2 {
                color: #1976aa;
            }
            .dark-theme {
                --ink: #e4f3ff;
                --back: #122638;
                --paper: #18374d;
                --line: #558ca8;
            }
            .dark-theme section,
            .dark-theme .student-card {
                background: #23475e;
            }
            .dark-theme h2 {
                color: #8bd9ff;
            }
        </style>
    </head>
    <body class="${theme}-theme">
        <main class="profile nahida-container" data-profile-theme="BlueArchive">
            <div class="school-banner">学生档案 / 长期记录</div>
            <div class="identity student-card">
                <img class="portrait" src="${avatar}" alt="用户头像" />
                <div>
                    <h1>${username}</h1>
                    <p>用户编号 ${userId}</p>
                    <p>最近更新 ${analysisDate}</p>
                </div>
            </div>
            <div class="columns">
                <div>
                    <section class="">
                        <h2>学籍摘要</h2>
                        <p>${summary}</p>
                    </section>
                    <section class="">
                        <h2>性格档案</h2>
                        <div class="tags">${keyTraits}</div>
                    </section>
                    <section class="">
                        <h2>兴趣社团</h2>
                        <div class="tags">${interests}</div>
                    </section>
                </div>
                <div>
                    <section class="">
                        <h2>交流方式</h2>
                        <p>${communicationStyle}</p>
                    </section>
                    <section class="">
                        <h2>活动记录 · 事实依据</h2>
                        <div class="records">${evidence}</div>
                    </section>
                </div>
            </div>
            <footer>
                长期用户画像 · 基于已积累的观察记录 · 群友称号仅代表本期表现
            </footer>
        </main>
    </body>
</html>
