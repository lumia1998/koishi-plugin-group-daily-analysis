<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人物专访</title>
    <link rel="stylesheet" href="./css/template_group.css">
</head>

<body class="${theme}-theme">
    <div class="paper-container">
        <!-- Masthead -->
        <header class="newspaper-header">
            <div class="header-top-meta">
                <span class="meta-item">群聊观察专刊</span>
                <span class="meta-item">${analysisDate}</span>
                <span class="meta-item">人物专刊</span>
            </div>
            <h1 class="newspaper-title">人物专访</h1>
            <div class="header-sub">
                <span class="sub-text">长期人物档案 · ${username}</span>
            </div>
        </header>

        <div class="newspaper-content">
            <div class="main-columns">
                <!-- Left Column: Profile Photo & Basic Info -->
                <aside class="column-sidebar">
                    <div class="paper-box photo-box">
                        <div class="photo-frame">
                            <img src="${avatar}" alt="用户头像" class="profile-photo">
                        </div>
                        <div class="photo-caption">
                            <span class="caption-text">${username}</span>
                        </div>
                    </div>

                    <div class="paper-box info-box">
                        <h3 class="box-title">档案资料</h3>
                        <div class="info-content">
                            <p><strong>用户编号：</strong> ${userId}</p>
                            <p><strong>最近更新：</strong> ${analysisDate}</p>
                        </div>
                    </div>

                    <div class="paper-box tags-box">
                        <h3 class="box-title">核心特质</h3>
                        <div class="tags-list">
                            ${keyTraits}
                        </div>
                    </div>

                    <div class="paper-box tags-box">
                        <h3 class="box-title">兴趣领域</h3>
                        <div class="tags-list">
                            ${interests}
                        </div>
                    </div>
                </aside>

                <!-- Right Column: Interview Content -->
                <section class="column-main-wide">
                    <div class="article-block">
                        <div class="section-label"><span>人物速写</span></div>
                        <div class="article-text first-letter-big">
                            ${summary}
                        </div>
                    </div>

                    <div class="article-block">
                        <div class="section-label"><span>沟通风格</span></div>
                        <div class="article-text">
                            ${communicationStyle}
                        </div>
                    </div>

                    <div class="article-block">
                        <div class="section-label"><span>事实依据与代表记录</span></div>
                        <div class="evidence-content">
                            ${evidence}
                        </div>
                    </div>
                </section>
            </div>
        </div>

        <footer class="newspaper-footer">
            <div class="footer-line"></div>
            <p>由 ChatLuna 生成 · 长期人物档案</p>
        </footer>
    </div>
    <script>
        const themeSetting = '${theme}';
        const body = document.body;

        function applyTheme(themeName) {
            if (themeName === 'dark') {
                body.classList.add('dark-theme');
            } else {
                body.classList.remove('dark-theme');
            }
        }

        function init() {
            if (themeSetting === 'auto') {
                const hour = new Date().getHours();
                const theme = hour >= 19 || hour < 6 ? 'dark' : 'light';
                applyTheme(theme);
            } else {
                applyTheme(themeSetting);
            }
        }

        init();
    </script>
</body>

</html>
