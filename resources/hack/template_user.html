<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>用户观测终端</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 28px;
                font:
                    18px/1.75 'Microsoft YaHei',
                    sans-serif;
                color: var(--ink);
                background: var(--back);
            }
            .profile {
                width: 100%;
                max-width: 1000px;
                margin: auto;
                padding: 40px;
                background: var(--paper);
                overflow: hidden;
            }
            h1 {
                font-size: 42px;
                line-height: 1.3;
                margin: 10px 0;
            }
            h2 {
                font-size: 23px;
                margin: 0 0 16px;
            }
            p {
                white-space: pre-wrap;
                margin: 10px 0;
                overflow-wrap: anywhere;
            }
            header,
            .identity {
                display: flex;
                align-items: center;
                gap: 28px;
            }
            .portrait {
                width: 142px;
                height: 142px;
                object-fit: cover;
                flex-shrink: 0;
            }
            .columns {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 24px;
            }
            section {
                min-width: 0;
                margin: 24px 0;
                padding: 24px;
                border: 1px solid var(--line);
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }
            .tags > * {
                max-width: 100%;
                overflow-wrap: anywhere;
            }
            .records {
                overflow-wrap: anywhere;
            }
            .records > * {
                margin: 12px 0;
            }
            footer {
                margin-top: 32px;
                padding-top: 18px;
                border-top: 1px solid var(--line);
                font-size: 14px;
            }
            .empty-state,
            .empty-news {
                opacity: 0.7;
            }
            .chip,
            .tag,
            .news-tag,
            .washi-tape-tag {
                display: inline-block;
                padding: 6px 12px;
                border: 1px solid var(--line);
            }
            @media (max-width: 650px) {
                body {
                    padding: 12px;
                }
                .profile {
                    padding: 22px;
                }
                .columns {
                    grid-template-columns: 1fr;
                }
                header,
                .identity {
                    flex-wrap: wrap;
                }
                h1 {
                    font-size: 32px;
                }
            }
            :root {
                --ink: #91f3a0;
                --back: #050b08;
                --paper: #0a140f;
                --line: #315a3d;
            }
            body {
                font-family:
                    'Cascadia Code', Consolas, 'Microsoft YaHei', monospace;
            }
            .profile {
                border: 1px solid #599f6c;
            }
            .terminal-bar {
                padding: 8px 14px;
                background: #264931;
                color: #d0ffd8;
                letter-spacing: 3px;
            }
            header {
                margin: 30px 0;
            }
            .portrait {
                filter: grayscale(1);
                border: 1px solid #91f3a0;
                image-rendering: pixelated;
            }
            h1 {
                font-size: 34px;
            }
            h2 {
                font-size: 20px;
            }
            section {
                border: 0;
                border-left: 2px solid #315a3d;
                margin: 18px 0;
                padding: 16px 22px;
            }
            h2::before {
                content: '> ';
                color: #e0e794;
            }
            .news-tag {
                border-style: dashed;
            }
            .records {
                font-size: 16px;
            }
            .status {
                color: #d7dc85;
            }
        </style>
    </head>
    <body class="${theme}-theme">
        <main class="profile paper-container" data-profile-theme="hack">
            <div class="terminal-bar">● 用户档案读取终端</div>
            <header>
                <img class="portrait" src="${avatar}" alt="用户头像" />
                <div>
                    <h1>${username}</h1>
                    <p>用户编号 ${userId}</p>
                    <p>最近更新 ${analysisDate}</p>
                </div>
            </header>
            <p class="status">读取模式：长期观察记录 / 已保存画像</p>
            <section class="">
                <h2>读取画像摘要</h2>
                <p>${summary}</p>
            </section>
            <div class="columns">
                <section class="">
                    <h2>枚举核心特征</h2>
                    <div class="tags">${keyTraits}</div>
                </section>
                <section class="">
                    <h2>枚举兴趣主题</h2>
                    <div class="tags">${interests}</div>
                </section>
            </div>
            <section class="">
                <h2>解析沟通方式</h2>
                <p>${communicationStyle}</p>
            </section>
            <section class="">
                <h2>读取事实依据日志</h2>
                <div class="records">${evidence}</div>
            </section>
            <footer>
                长期用户画像 · 基于已积累的观察记录 · 群友称号仅代表本期表现
            </footer>
        </main>
    </body>
</html>
