<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>新春人物小传</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 28px;
                font:
                    18px/1.75 'Microsoft YaHei',
                    sans-serif;
                color: var(--ink);
                background: var(--back);
            }
            .profile {
                width: 100%;
                max-width: 1000px;
                margin: auto;
                padding: 40px;
                background: var(--paper);
                overflow: hidden;
            }
            h1 {
                font-size: 42px;
                line-height: 1.3;
                margin: 10px 0;
            }
            h2 {
                font-size: 23px;
                margin: 0 0 16px;
            }
            p {
                white-space: pre-wrap;
                margin: 10px 0;
                overflow-wrap: anywhere;
            }
            header,
            .identity {
                display: flex;
                align-items: center;
                gap: 28px;
            }
            .portrait {
                width: 142px;
                height: 142px;
                object-fit: cover;
                flex-shrink: 0;
            }
            .columns {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 24px;
            }
            section {
                min-width: 0;
                margin: 24px 0;
                padding: 24px;
                border: 1px solid var(--line);
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }
            .tags > * {
                max-width: 100%;
                overflow-wrap: anywhere;
            }
            .records {
                overflow-wrap: anywhere;
            }
            .records > * {
                margin: 12px 0;
            }
            footer {
                margin-top: 32px;
                padding-top: 18px;
                border-top: 1px solid var(--line);
                font-size: 14px;
            }
            .empty-state,
            .empty-news {
                opacity: 0.7;
            }
            .chip,
            .tag,
            .news-tag,
            .washi-tape-tag {
                display: inline-block;
                padding: 6px 12px;
                border: 1px solid var(--line);
            }
            @media (max-width: 650px) {
                body {
                    padding: 12px;
                }
                .profile {
                    padding: 22px;
                }
                .columns {
                    grid-template-columns: 1fr;
                }
                header,
                .identity {
                    flex-wrap: wrap;
                }
                h1 {
                    font-size: 32px;
                }
            }
            :root {
                --ink: #7b2924;
                --back: #f7e9d6;
                --paper: #fff6e4;
                --line: #d2a05f;
            }
            .profile {
                border: 8px double #b74030;
                position: relative;
            }
            .festive-title {
                text-align: center;
                font:
                    36px 'STKaiti',
                    'KaiTi',
                    serif;
                color: #a32d22;
                letter-spacing: 10px;
                padding: 14px;
                border-bottom: 2px solid #d2a05f;
            }
            header {
                margin: 30px 0;
                justify-content: center;
            }
            .portrait {
                border: 6px double #a83a2f;
                border-radius: 50%;
            }
            h1 {
                font-family: 'STKaiti', 'KaiTi', serif;
            }
            section {
                border: 1px solid #cf9f6a;
                background: #fffaf0;
                box-shadow: 5px 5px #ead3ad;
            }
            h2 {
                color: #a02b23;
                font-family: 'STKaiti', 'KaiTi', serif;
            }
            .washi-tape-tag {
                background: #f3dcc0;
            }
            .dark-theme {
                --ink: #ffdfb8;
                --back: #2b1110;
                --paper: #451d19;
                --line: #a77b4f;
            }
            .dark-theme section {
                background: #552922;
                box-shadow: 5px 5px #331812;
            }
            .dark-theme h1,
            .dark-theme h2,
            .dark-theme .festive-title {
                color: #ffd9a0;
            }
            .dark-theme .washi-tape-tag {
                background: #71372a;
            }
        </style>
    </head>
    <body class="${theme}-theme">
        <main class="profile container" data-profile-theme="spring_festival">
            <div class="festive-title">新春人物小传</div>
            <header>
                <img class="portrait" src="${avatar}" alt="用户头像" />
                <div>
                    <h1>${username}</h1>
                    <p>用户编号 ${userId}</p>
                    <p>最近更新 ${analysisDate}</p>
                </div>
            </header>
            <section class="">
                <h2>人物小传 · 长期画像</h2>
                <p>${summary}</p>
            </section>
            <div class="columns">
                <section class="">
                    <h2>性情签</h2>
                    <div class="tags">${keyTraits}</div>
                </section>
                <section class="">
                    <h2>雅趣录</h2>
                    <div class="tags">${interests}</div>
                </section>
            </div>
            <section class="">
                <h2>谈吐之间</h2>
                <p>${communicationStyle}</p>
            </section>
            <section class="">
                <h2>旧事留痕 · 事实依据</h2>
                <div class="records">${evidence}</div>
            </section>
            <footer>
                长期用户画像 · 基于已积累的观察记录 · 群友称号仅代表本期表现
            </footer>
        </main>
    </body>
</html>
