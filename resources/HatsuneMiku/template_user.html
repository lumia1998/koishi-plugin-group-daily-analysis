<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>个人声轨档案</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 28px;
                font:
                    18px/1.75 'Microsoft YaHei',
                    sans-serif;
                color: var(--ink);
                background: var(--back);
            }
            .profile {
                width: 100%;
                max-width: 1000px;
                margin: auto;
                padding: 40px;
                background: var(--paper);
                overflow: hidden;
            }
            h1 {
                font-size: 42px;
                line-height: 1.3;
                margin: 10px 0;
            }
            h2 {
                font-size: 23px;
                margin: 0 0 16px;
            }
            p {
                white-space: pre-wrap;
                margin: 10px 0;
                overflow-wrap: anywhere;
            }
            header,
            .identity {
                display: flex;
                align-items: center;
                gap: 28px;
            }
            .portrait {
                width: 142px;
                height: 142px;
                object-fit: cover;
                flex-shrink: 0;
            }
            .columns {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 24px;
            }
            section {
                min-width: 0;
                margin: 24px 0;
                padding: 24px;
                border: 1px solid var(--line);
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }
            .tags > * {
                max-width: 100%;
                overflow-wrap: anywhere;
            }
            .records {
                overflow-wrap: anywhere;
            }
            .records > * {
                margin: 12px 0;
            }
            footer {
                margin-top: 32px;
                padding-top: 18px;
                border-top: 1px solid var(--line);
                font-size: 14px;
            }
            .empty-state,
            .empty-news {
                opacity: 0.7;
            }
            .chip,
            .tag,
            .news-tag,
            .washi-tape-tag {
                display: inline-block;
                padding: 6px 12px;
                border: 1px solid var(--line);
            }
            @media (max-width: 650px) {
                body {
                    padding: 12px;
                }
                .profile {
                    padding: 22px;
                }
                .columns {
                    grid-template-columns: 1fr;
                }
                header,
                .identity {
                    flex-wrap: wrap;
                }
                h1 {
                    font-size: 32px;
                }
            }
            :root {
                --ink: #d8fff8;
                --back: #10242a;
                --paper: #15363c;
                --line: #3f827f;
            }
            .profile {
                border: 2px solid #43c7bc;
                box-shadow: 12px 12px #092127;
            }
            .player {
                display: grid;
                grid-template-columns: 180px minmax(0, 1fr);
                gap: 30px;
                padding: 24px;
                background: #09282e;
            }
            .portrait {
                width: 180px;
                height: 180px;
                border-radius: 50%;
                border: 14px solid #1a4b50;
                outline: 2px solid #43c7bc;
            }
            .wave {
                height: 40px;
                margin: 20px 0;
                background: repeating-linear-gradient(
                    90deg,
                    #43c7bc 0 4px,
                    transparent 4px 10px
                );
                clip-path: polygon(
                    0 40%,
                    10% 10%,
                    20% 50%,
                    30% 0,
                    40% 70%,
                    50% 20%,
                    60% 60%,
                    70% 0,
                    80% 40%,
                    90% 10%,
                    100% 50%,
                    100% 100%,
                    0 100%
                );
            }
            h2 {
                color: #63ead4;
            }
            section {
                border: 0;
                border-bottom: 1px solid #3f827f;
                padding: 18px 0;
            }
            .track {
                display: grid;
                grid-template-columns: 65px minmax(0, 1fr);
                gap: 20px;
            }
            .track > span {
                font-size: 32px;
                color: #ef70ac;
                padding-top: 30px;
            }
            .chip,
            .tag {
                background: #255056;
                border: 0;
            }
            footer {
                color: #72b6b2;
            }
        </style>
    </head>
    <body class="${theme}-theme">
        <main class="profile nahida-container" data-profile-theme="HatsuneMiku">
            <p>个人声轨档案 · 长期画像</p>
            <div class="player">
                <img class="portrait" src="${avatar}" alt="用户头像" />
                <div>
                    <h1>${username}</h1>
                    <p>用户编号 ${userId}</p>
                    <p>最近更新 ${analysisDate}</p>
                </div>
            </div>
            <div class="wave" aria-hidden="true"></div>
            <div class="track">
                <span>01</span>
                <section class="">
                    <h2>主打曲 / 画像摘要</h2>
                    <p>${summary}</p>
                </section>
            </div>
            <div class="columns">
                <div class="track">
                    <span>02</span>
                    <section class="">
                        <h2>个性音色</h2>
                        <div class="tags">${keyTraits}</div>
                    </section>
                </div>
                <div class="track">
                    <span>03</span>
                    <section class="">
                        <h2>兴趣歌单</h2>
                        <div class="tags">${interests}</div>
                    </section>
                </div>
            </div>
            <div class="track">
                <span>04</span>
                <section class="">
                    <h2>对话节奏</h2>
                    <p>${communicationStyle}</p>
                </section>
            </div>
            <div class="track">
                <span>05</span>
                <section class="">
                    <h2>采样记录 / 事实依据</h2>
                    <div class="records">${evidence}</div>
                </section>
            </div>
            <footer>
                长期用户画像 · 基于已积累的观察记录 · 群友称号仅代表本期表现
            </footer>
        </main>
    </body>
</html>
