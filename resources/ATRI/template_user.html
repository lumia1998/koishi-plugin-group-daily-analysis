<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>人格观测终端</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 28px;
                font:
                    18px/1.75 'Microsoft YaHei',
                    sans-serif;
                color: var(--ink);
                background: var(--back);
            }
            .profile {
                width: 100%;
                max-width: 1000px;
                margin: auto;
                padding: 40px;
                background: var(--paper);
                overflow: hidden;
            }
            h1 {
                font-size: 42px;
                line-height: 1.3;
                margin: 10px 0;
            }
            h2 {
                font-size: 23px;
                margin: 0 0 16px;
            }
            p {
                white-space: pre-wrap;
                margin: 10px 0;
                overflow-wrap: anywhere;
            }
            header,
            .identity {
                display: flex;
                align-items: center;
                gap: 28px;
            }
            .portrait {
                width: 142px;
                height: 142px;
                object-fit: cover;
                flex-shrink: 0;
            }
            .columns {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 24px;
            }
            section {
                min-width: 0;
                margin: 24px 0;
                padding: 24px;
                border: 1px solid var(--line);
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
            }
            .tags > * {
                max-width: 100%;
                overflow-wrap: anywhere;
            }
            .records {
                overflow-wrap: anywhere;
            }
            .records > * {
                margin: 12px 0;
            }
            footer {
                margin-top: 32px;
                padding-top: 18px;
                border-top: 1px solid var(--line);
                font-size: 14px;
            }
            .empty-state,
            .empty-news {
                opacity: 0.7;
            }
            .chip,
            .tag,
            .news-tag,
            .washi-tape-tag {
                display: inline-block;
                padding: 6px 12px;
                border: 1px solid var(--line);
            }
            @media (max-width: 650px) {
                body {
                    padding: 12px;
                }
                .profile {
                    padding: 22px;
                }
                .columns {
                    grid-template-columns: 1fr;
                }
                header,
                .identity {
                    flex-wrap: wrap;
                }
                h1 {
                    font-size: 32px;
                }
            }
            :root {
                --ink: #214c63;
                --back: #dff3fa;
                --paper: #f8fdff;
                --line: #9acdda;
            }
            .profile {
                border-top: 8px solid #4ca7c9;
                background-image:
                    linear-gradient(#9acdda22 1px, transparent 1px),
                    linear-gradient(90deg, #9acdda22 1px, transparent 1px);
                background-size: 24px 24px;
            }
            .portrait {
                border-radius: 50%;
                outline: 2px solid #57bdd9;
                outline-offset: 8px;
            }
            header {
                padding: 28px 0;
                border-bottom: 2px solid #4ca7c9;
            }
            .terminal-label {
                letter-spacing: 5px;
                color: #387d99;
            }
            section {
                background: #ffffffcf;
                border-left: 5px solid #4ca7c9;
            }
            .log {
                border-style: dashed;
            }
            .dark-theme {
                --ink: #daeff9;
                --back: #071d2b;
                --paper: #0c2b3a;
                --line: #467688;
            }
            .dark-theme section {
                background: #103546;
            }
        </style>
    </head>
    <body class="${theme}-theme">
        <main class="profile nahida-container" data-profile-theme="ATRI">
            <div class="terminal-label">人工智能 · 长期观测档案</div>
            <header>
                <img class="portrait" src="${avatar}" alt="用户头像" />
                <div>
                    <h1>${username}</h1>
                    <p>用户编号 ${userId}</p>
                    <p>最近更新 ${analysisDate}</p>
                </div>
            </header>
            <section class="">
                <h2>01 / 人格资料</h2>
                <p>${summary}</p>
            </section>
            <div class="columns">
                <section class="">
                    <h2>02 / 核心特征</h2>
                    <div class="tags">${keyTraits}</div>
                </section>
                <section class="">
                    <h2>03 / 兴趣数据库</h2>
                    <div class="tags">${interests}</div>
                </section>
            </div>
            <section class="">
                <h2>04 / 沟通模式</h2>
                <p>${communicationStyle}</p>
            </section>
            <section class="log">
                <h2>05 / 观测日志与事实依据</h2>
                <div class="records">${evidence}</div>
            </section>
            <footer>
                长期用户画像 · 基于已积累的观察记录 · 群友称号仅代表本期表现
            </footer>
        </main>
    </body>
</html>
